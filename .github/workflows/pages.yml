name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons _site/
          # 배포마다 서비스 워커 캐시 이름을 바꿔 새 파일을 한 번만 받게 한다
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
          grep -q "${GITHUB_SHA::8}" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
