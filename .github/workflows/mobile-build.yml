name: Mobile Native Build Check

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/build-web.mjs'

permissions:
  contents: read

jobs:
  android:
    name: Android Build (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies & test
        run: |
          npm ci
          npm test
          npm run cap:sync
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Decode release keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            printf 'storeFile=app/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > android/keystore.properties
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured; building unsigned release AAB."
          fi
      - name: Build Android Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS Build Check (Simulator / Archive)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies & sync Capacitor
        run: |
          npm ci
          npm test
          npm run cap:sync
      - name: Resolve Swift Package dependencies & build iOS Simulator
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive signed iOS IPA (if certificates configured)
        id: ios-archive
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERT_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            CERT_PATH=$RUNNER_TEMP/certificate.p12
            PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
            echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            security create-keychain -p "ci-temp-keychain" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "ci-temp-keychain" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
            xcodebuild archive \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              -allowProvisioningUpdates
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist ios/App/ExportOptions.plist \
              -allowProvisioningUpdates
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "APPLE_CERT_BASE64 / APPLE_PROVISIONING_PROFILE_BASE64 not configured; skipping IPA archive."
          fi
      - name: Upload iOS IPA (when signed)
        if: ${{ steps.ios-archive.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
