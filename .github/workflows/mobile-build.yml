name: Mobile Native Build Check

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: '서명된 iOS IPA를 App Store Connect(TestFlight)로 업로드'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/build-web.mjs'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android Build (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies & test
        run: |
          npm ci
          npm test
          npm run cap:sync
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK & licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDK_MANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDK_MANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null
          set -o pipefail
          "$SDK_MANAGER" --sdk_root="$ANDROID_SDK" "platforms;android-36" "platform-tools"
      - name: Decode & verify release keystore (if configured)
        id: android-sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
              echo "ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must be set when ANDROID_KEYSTORE_BASE64 is configured." >&2
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/app/release.keystore
            keytool -list -keystore android/app/release.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null
            printf 'storeFile=app/release.keystore\n' > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 is not configured; building unsigned release AAB."
          fi
      - name: Build Android Debug APK & Release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease
          if [ "${{ steps.android-sign.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          fi
      - name: Clean up Android keystore files
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS Build Check (Simulator / Archive)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies & sync Capacitor
        run: |
          npm ci
          npm test
          npm run cap:sync
      - name: Resolve Swift Package dependencies & build iOS Simulator
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive & export signed iOS IPA (if certificates configured)
        id: ios-archive
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERT_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
            PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
            EXPORT_PLIST="$RUNNER_TEMP/ExportOptionsCI.plist"

            echo "$APPLE_CERT_BASE64" | tr -d '\r\n' | base64 --decode > "$CERT_PATH"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n' | base64 --decode > "$PROFILE_PATH"

            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
            TEAM_ID="${APPLE_TEAM_ID:-$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")}"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"

            security create-keychain -p "ci-temp-keychain" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "ci-temp-keychain" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "ci-temp-keychain" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security default-keychain -s "$KEYCHAIN_PATH"

            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E "Apple Distribution|iPhone Distribution" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
            if [ -z "$SIGNING_IDENTITY" ]; then
              SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E '^\s*[0-9]+\)' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            fi
            if [ -z "$SIGNING_IDENTITY" ]; then
              echo "No valid codesigning identity found in imported certificate." >&2
              exit 1
            fi

            EXPORT_METHOD=$(python3 - "$PROFILE_PLIST" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              p = plistlib.load(f)
          ent = p.get('Entitlements', {})
          if p.get('ProvisionsAllDevices'):
              print('enterprise')
          elif 'ProvisionedDevices' in p:
              print('development' if ent.get('get-task-allow') else 'ad-hoc')
          else:
              print('app-store-connect')
          PY
            )

            python3 - "$EXPORT_PLIST" "$EXPORT_METHOD" "$TEAM_ID" "$PROFILE_NAME" "$SIGNING_IDENTITY" <<'PY'
          import plistlib, sys
          out_path, method, team_id, profile_name, cert_name = sys.argv[1:]
          opts = {
              'destination': 'export',
              'method': method,
              'signingStyle': 'manual',
              'teamID': team_id,
              'signingCertificate': cert_name,
              'provisioningProfiles': {
                  'com.mjbest.nightskyshot': profile_name,
              },
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          if method == 'app-store-connect':
              opts['manageAppVersionAndBuildNumber'] = True
          with open(out_path, 'wb') as f:
              plistlib.dump(opts, f)
          PY

            xcodebuild archive \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              CODE_SIGN_IDENTITY="$SIGNING_IDENTITY"

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$EXPORT_PLIST"

            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "APPLE_CERT_BASE64 / APPLE_PROVISIONING_PROFILE_BASE64 not configured; skipping IPA archive."
          fi
      - name: Validate & upload iOS IPA to App Store Connect (TestFlight)
        if: ${{ steps.ios-archive.outputs.signed == 'true' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.upload_to_app_store == true) }}
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$ASC_API_KEY_BASE64" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            KEY_DIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEY_DIR"
            KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
            echo "$ASC_API_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
            if [ -z "$IPA_PATH" ]; then
              echo "Signed .ipa not found in $RUNNER_TEMP/export" >&2
              exit 1
            fi
            xcrun altool --validate-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
          else
            echo "ASC_API_KEY_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID not configured; skipping App Store Connect upload."
          fi
      - name: Clean up iOS signing keychain & temporary files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptionsCI.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
      - name: Upload iOS IPA (when signed)
        if: ${{ steps.ios-archive.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

  release:
    name: Create Draft GitHub Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload build artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find artifacts -type f \( -name '*.aab' -o -name '*.apk' -o -name '*.ipa' \) | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release artifacts found to attach." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
